name: TCF Blind Forecast Alpha
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'tcf_blind/case_alpha/**'
      - '.github/workflows/tcf_blind_forecast.yml'
permissions:
  contents: read
  models: read
jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply deterministic runtime hardening
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tcf_blind/case_alpha/run_forecast.py')
          s=p.read_text()
          s=s.replace('for i in range(2):', 'for i in range(3):')
          old="weights=forecast['mechanism_map'].get('weights', forecast['mechanism_map'])\nif not isinstance(weights,dict) or not weights: weights={'recurring-contract-software':1.0}\ns=sum(float(v) for v in weights.values()); weights={k:float(v)/s for k,v in weights.items()}"
          new="weights=forecast['mechanism_map'].get('weights', {}) if isinstance(forecast['mechanism_map'],dict) else {}\nweights={str(k):float(v) for k,v in weights.items() if isinstance(v,(int,float)) or str(v).replace('.','',1).isdigit()}\nif not weights: weights={'recurring-contract-software':1.0}\ns=sum(weights.values()); weights={k:v/s for k,v in weights.items()}"
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Install workbook dependency
        run: python -m pip install --quiet xlsxwriter
      - name: Run isolated blind forecaster
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MODEL_ID: openai/gpt-4.1
        run: python tcf_blind/case_alpha/run_forecast.py
      - name: Upload sealed forecast
        uses: actions/upload-artifact@v4
        with:
          name: tcf-blind-alpha-forecast
          path: |
            tcf_blind/case_alpha/forecast_workspace
            tcf_blind/case_alpha/raw_api_response.json
          if-no-files-found: error
