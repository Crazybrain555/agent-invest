[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "envelope-kernel"
version = "0.1.0"
description = "Shared L1 data_asset envelope kernel: field model, kind matrix, asset:// URI rules, contract schema."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8",
]

[project.optional-dependencies]
test = [
  "jsonschema>=4",
]
dev = [
  "ruff>=0.15",
  "mypy>=1.14",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.mypy]
python_version = "3.11"
files = ["src/envelope_kernel"]
mypy_path = "src"
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
