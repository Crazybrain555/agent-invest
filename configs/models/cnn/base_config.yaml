version: "1.0"  # 添加版本字段
# CNN基类通用配置
# 包含所有CNN类模型共享的基础配置

# 数据处理配置
data:
  sequence_length: 60      # 序列长度
  data_format: "channels_first"  # 数据格式: channels_first或channels_last
  normalization: "batch"   # 归一化方式: batch或instance

# 通用训练配置
training:
  batch_size: 32
  weight_init_type: "kaiming"  # 权重初始化方法
  use_bias: true             # 是否使用偏置

# 通用CNN参数
cnn_params:
  activation: "relu"         # 激活函数
  pooling_type: "max"        # 池化类型: max或avg
  use_batch_norm: true       # 是否使用批量归一化
  use_residual: false        # 是否使用残差连接 