version: "1.0"  # 添加版本字段# 基础MLP模型配置
model_type: "MLP"
model_name: "mlp_basic"
description: "基础多层感知机模型，用于特征工程后的预测"

# 模型架构
architecture:
  input_size: 100            # 输入特征维度
  hidden_layers: [256, 128, 64]  # 隐藏层大小
  dropout: 0.2               # Dropout比率
  batch_norm: true           # 是否使用批量归一化
  activation: "relu"         # 激活函数
  output_size: 1             # 输出维度
  output_activation: "linear"  # 输出层激活函数

# 训练特定设置
training:
  batch_size: 64             # 批次大小
  epochs: 100                # 训练轮次
  optimizer:
    type: "Adam"             # 优化器类型
    learning_rate: 0.001     # 学习率
    weight_decay: 0.0001     # 权重衰减
  scheduler:
    type: "ReduceLROnPlateau"  # 学习率调度器
    factor: 0.5              # 学习率衰减因子
    patience: 5              # 等待轮次
    min_lr: 0.00001          # 最小学习率
  loss_function: "MSE"       # 损失函数
  early_stopping:
    patience: 15             # 早停等待轮次
    monitor: "val_loss"      # 监控指标

# 评估配置
evaluation:
  metrics: ["MSE", "MAE", "RANK_IC", "Sharpe", "MaxDrawdown"]
  validation_split: 0.1
  validation_frequency: 1 