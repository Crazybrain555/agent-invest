# MLP基类通用配置
# 包含所有MLP类模型共享的基础配置
version: "1.0"  # 添加版本字段
# 数据处理配置
data:
  flattened_input: true     # 是否将输入展平
  feature_scaling: "standard"  # 特征缩放方式: standard或minmax

# 通用训练配置
training:
  batch_size: 64
  weight_init_type: "xavier"  # 权重初始化方法
  use_bias: true             # 是否使用偏置

# 通用MLP参数
mlp_params:
  activation: "relu"         # 激活函数
  use_batch_norm: true       # 是否使用批量归一化
  dropout_type: "standard"   # Dropout类型: standard或alpha 