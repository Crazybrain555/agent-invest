# 集成模型基类通用配置
# 包含所有集成模型共享的基础配置
version: "1.0"  # 添加版本字段
# 通用数据处理配置
data:
  split_type: "time_series"  # 数据分割类型: time_series或random
  test_size: 0.1             # 测试集比例
  val_size: 0.1              # 验证集比例

# 通用集成参数
ensemble_params:
  voting_type: "soft"        # 投票类型: hard或soft
  meta_model_type: "linear"  # 元模型类型: linear, rf, gbm, mlp等
  enable_bagging: true       # 是否启用bagging
  bagging_fraction: 0.8      # bagging样本比例
  n_bags: 5                  # bagging次数 