# Stacking集成模型配置
model_type: "Ensemble"
model_name: "stacking_ensemble"
description: "Stacking集成模型，组合多种基础模型的预测结果"
version: "1.0"  # 添加版本字段
# 集成架构
architecture:
  # 基础模型配置
  base_models:
    - model_type: "LSTM"
      model_name: "lstm_basic"
      weight: 1.0               # 模型权重
    - model_type: "GRU"
      model_name: "gru_basic"
      weight: 1.0
    - model_type: "Transformer"
      model_name: "transformer_vanilla"
      weight: 1.0
    - model_type: "CNN"
      model_name: "temporal_cnn"
      weight: 0.8
    - model_type: "MLP"
      model_name: "mlp_basic"
      weight: 0.5
  
  # 元模型配置
  meta_model:
    type: "LogisticRegression"  # 元模型类型
    params:
      C: 1.0                    # 正则化强度倒数
      penalty: "l2"             # 惩罚类型
      solver: "lbfgs"           # 求解器
    use_proba: true             # 是否使用概率输出

# 训练特定设置
training:
  cv_folds: 5                   # 交叉验证折数
  use_oof: true                 # 是否使用Out-of-Fold预测
  batch_size: 64                # 批次大小
  epochs: 50                    # 训练轮次
  optimizer:
    type: "Adam"                # 优化器类型
    learning_rate: 0.001        # 学习率
    weight_decay: 0.0001        # 权重衰减
  early_stopping:
    patience: 10                # 早停等待轮次
    monitor: "val_loss"         # 监控指标

# 评估配置
evaluation:
  metrics: ["MSE", "MAE", "RANK_IC", "Sharpe", "MaxDrawdown"]
  validation_split: 0.1
  validation_frequency: 1
  
# 特有配置
stacking_specific:
  stack_method: "predict_proba"   # 堆叠方法: predict或predict_proba
  use_base_features: false        # 是否在元模型中使用原始特征
  pass_through_features: []       # 直接传递给元模型的特征 