version: "1.0"  # 添加版本字段
# Voting集成模型配置
model_type: "Ensemble"
model_name: "voting_ensemble"
description: "Voting集成模型，通过加权投票组合多种基础模型的预测结果"

# 集成架构
architecture:
  # 基础模型配置
  base_models:
    - model_type: "LSTM"
      model_name: "lstm_attention"
      weight: 1.2               # 模型权重
    - model_type: "GRU"
      model_name: "gru_dfzq"
      weight: 1.5
    - model_type: "Transformer"
      model_name: "transformer_vanilla"
      weight: 1.0
    - model_type: "CNN"
      model_name: "resnet_cnn"
      weight: 0.8
  
  # 投票配置
  voting:
    type: "soft"              # 投票类型: hard或soft
    weights_mode: "fixed"     # 权重模式: fixed, auto或adaptive
    normalize_predictions: true  # 是否归一化预测值

# 训练特定设置
training:
  parallel_training: true     # 是否并行训练基础模型
  batch_size: 64              # 批次大小
  epochs: 100                 # 训练轮次
  early_stopping:
    patience: 15              # 早停等待轮次
    monitor: "val_loss"       # 监控指标

# 评估配置
evaluation:
  metrics: ["MSE", "MAE", "RANK_IC", "Sharpe", "MaxDrawdown"]
  validation_split: 0.1
  validation_frequency: 1
  
# 特有配置
voting_specific:
  dynamic_weighting: true     # 是否动态调整权重
  dynamic_method: "performance_based"  # 动态调整方法: performance_based或uncertainty_based
  recalibrate_predictions: true  # 是否重新校准预测值 