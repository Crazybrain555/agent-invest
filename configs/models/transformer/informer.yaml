# Informer模型配置
model_type: "Transformer"
model_name: "informer"
description: "Informer模型，增强长序列时间序列预测的Transformer变种"

# 模型架构
architecture:
  input_size: 100            # 输入特征维度
  d_model: 512               # 模型维度
  nhead: 8                   # 注意力头数
  num_encoder_layers: 3      # 编码器层数
  num_decoder_layers: 2      # 解码器层数
  dim_feedforward: 1024      # 前馈网络维度
  dropout: 0.1               # Dropout比率
  activation: "gelu"         # 激活函数
  output_size: 1             # 输出维度
  positional_encoding: true  # 使用位置编码
  max_seq_length: 96         # 最大序列长度

  # Informer特有参数
  informer_params:
    prob_sparse_attn: true   # 是否使用ProbSparse注意力
    distil: true             # 是否使用蒸馏
    sampling_factor: 5       # 采样因子
    distil_ratio: 0.5        # 蒸馏比例

# 训练特定设置
training:
  batch_size: 32             # 批次大小
  epochs: 100                # 训练轮次
  sequence_length: 96        # 序列长度
  pred_length: 24            # 预测长度
  optimizer:
    type: "Adam"             # 优化器类型
    learning_rate: 0.0001    # 学习率
    weight_decay: 0.00001    # 权重衰减
  scheduler:
    type: "OneCycleLR"       # 学习率调度器
    max_lr: 0.001            # 最大学习率
    steps_per_epoch: null    # 每轮步数，自动计算
    epochs: 100              # 轮数
  loss_function: "MSE"       # 损失函数
  early_stopping:
    patience: 15             # 早停等待轮次
    monitor: "val_loss"      # 监控指标
    
# 评估配置
evaluation:
  metrics: ["MSE", "MAE", "RANK_IC", "Sharpe", "MaxDrawdown"]
  validation_split: 0.1
  validation_frequency: 1
  
# 预测配置
prediction:
  stride: 1                  # 预测步长
  multi_step_forecast: true  # 是否多步预测 