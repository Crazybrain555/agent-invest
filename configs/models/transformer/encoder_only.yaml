architecture:
  activation: gelu
  d_model: 128
  dim_feedforward: 512
  dropout: 0.1
  embedding_type: linear
  input_size: 37
  nhead: 8
  norm_first: true
  norm_type: layer
  num_encoder_layers: 4
  output_size: 1
  positional_encoding: true
  seq_length: 30
data:
  chunk_size: 8192
  dataset_path: data/Dataset/pv_v5_pv_v5_pvh
  date_ranges:
    test:
    - '20220101'
    - '20241231'
    train:
    - '20080101'
    - '20181231'
    valid:
    - '20190101'
    - '20211231'
  duck_cache: 4GB
  duck_memory: 16GB
  duck_threads: 16
  memory_limit: 16GB
  prefetch_factor: 4
  reverse_seq: false
  selected_factors:
  - adj_close_mar_w1
  - adj_open_mar_w1
  - adj_high_mar_w1
  - adj_low_mar_w1
  - vwap_mar_w1
  - vwap_mar_w30
  - amount_mar_w30
  - swing_w0
  - High_PVcor_w0
  - MinuVol_call_w0
  - amresid_amount_w0
  - apm_w0
  - high_pvi_w0
  - high_vol_close_w0
  - high_vol_open_w0
  - high_vr_w0
  - price2vol_w0
  - residpos_amount_pm_w0
  - up_down_limit_status_w0
  use_custom_splits: true
  use_fixed_indices: true
description: 仅使用编码器的Transformer模型，适用于时间序列预测任务
evaluation:
  metrics:
  - MSE
  - MAE
  - RANK_IC
  - Sharpe
  - MaxDrawdown
  validation_frequency: 1
  validation_split: 0.1
model_name: encoder_only_transformer
model_type: EncoderOnlyTransformer
preset: custom
presets:
  custom:
    architecture:
      activation: gelu
      d_model: 64
      dim_feedforward: 128
      dropout: 0.15
      embedding_type: linear
      input_size: 19
      nhead: 4
      norm_first: true
      norm_type: layer
      num_encoder_layers: 6
      output_size: 1
      positional_encoding: true
      seq_length: 30
    description: 自定模型
    training:
      batch_size: 2048
      early_stopping:
        min_delta: 1e-4
        monitor: val_loss
        patience: 500
      epochs: 100
      grad_clip_norm: 1.0
      loss_function: MSE
      noise:
        apply_to_features: false
        apply_to_labels: false
        enabled: false
        gaussian_std: 0.05
      optimizer:
        beta1: 0.9
        beta2: 0.999
        learning_rate: 6e-5
        type: AdamW
        weight_decay: 5e-5
      scheduler:
        factor: 0.9
        lr_scheduler_warmup_epochs: 5
        min_lr: 5e-6
        patience: 5
        type: warm_cos
      warm_up:
        enabled: false
        steps: 1000
  large:
    architecture:
      activation: gelu
      d_model: 256
      dim_feedforward: 1024
      dropout: 0.1
      embedding_type: linear
      input_size: 37
      nhead: 8
      norm_type: layer
      num_encoder_layers: 6
      output_size: 1
      positional_encoding: true
      seq_length: 30
    description: 大型模型 - 最高性能
    training:
      batch_size: 2048
      early_stopping:
        min_delta: 1e-4
        monitor: val_loss
        patience: 25
      epochs: 150
      loss_function: MSE
      noise:
        apply_to_features: true
        apply_to_labels: false
        enabled: false
        gaussian_std: 0.01
      optimizer:
        beta1: 0.9
        beta2: 0.999
        learning_rate: 0.0001
        type: AdamW
        weight_decay: 0.01
      scheduler:
        factor: 0.9
        min_lr: 1e-7
        patience: 15
        type: ReduceLROnPlateau
      warm_up:
        enabled: true
        steps: 1000
  medium:
    architecture:
      activation: gelu
      d_model: 128
      dim_feedforward: 512
      dropout: 0.1
      embedding_type: linear
      input_size: 37
      nhead: 8
      norm_type: layer
      num_encoder_layers: 4
      output_size: 1
      positional_encoding: true
      seq_length: 30
    description: 中型模型 - 平衡性能和效率
    training:
      batch_size: 2048
      early_stopping:
        min_delta: 1e-4
        monitor: val_loss
        patience: 20
      epochs: 100
      loss_function: MSE
      noise:
        apply_to_features: true
        apply_to_labels: false
        enabled: false
        gaussian_std: 0.01
      optimizer:
        beta1: 0.9
        beta2: 0.999
        learning_rate: 0.0001
        type: Adam
        weight_decay: 0.0001
      scheduler:
        factor: 0.9
        min_lr: 1e-7
        patience: 10
        type: ReduceLROnPlateau
      warm_up:
        enabled: false
        steps: 1000
  small:
    architecture:
      activation: gelu
      d_model: 64
      dim_feedforward: 128
      dropout: 0.1
      embedding_type: linear
      input_size: 37
      nhead: 4
      norm_type: layer
      num_encoder_layers: 2
      output_size: 1
      positional_encoding: true
      seq_length: 30
    description: 小型模型 - 快速训练和推理
    training:
      batch_size: 2048
      early_stopping:
        min_delta: 1e-4
        monitor: val_loss
        patience: 10
      epochs: 50
      loss_function: MSE
      noise:
        apply_to_features: true
        apply_to_labels: false
        enabled: false
        gaussian_std: 0.01
      optimizer:
        beta1: 0.9
        beta2: 0.999
        learning_rate: 0.0001
        type: Adam
        weight_decay: 0.0001
      scheduler:
        factor: 0.9
        min_lr: 1e-6
        patience: 5
        type: ReduceLROnPlateau
      warm_up:
        enabled: false
        steps: 1000
saving:
  checkpoint_format: encoder_only_{epoch}_{val_loss:.4f}.pth
  max_saved_models: 5
  save_dir: outputs/encoder_only_transformer
  save_frequency: 10
  tensorboard_in_experiment_dir: false
training:
  batch_size: 2048
  early_stopping:
    min_delta: 1e-4
    monitor: val_loss
    patience: 20
  epochs: 100
  loss_function: MSE
  noise:
    apply_to_features: true
    apply_to_labels: false
    enabled: false
    gaussian_std: 0.01
  optimizer:
    beta1: 0.9
    beta2: 0.999
    learning_rate: 0.0001
    type: Adam
    weight_decay: 0.0001
  scheduler:
    factor: 0.9
    min_lr: 1e-7
    patience: 10
    type: ReduceLROnPlateau
  warm_up:
    enabled: false
    steps: 1000
