version: "1.0"  # 添加版本字段
# 基础GRU模型配置
model_type: "GRU"
model_name: "gru_basic"
description: "标准GRU模型，用于时间序列预测"

# 模型架构
architecture:
  input_size: 100          # 输入特征维度
  hidden_size: 128         # 隐藏层大小
  num_layers: 2            # GRU层数
  dropout: 0.2             # Dropout比率
  bidirectional: false     # 是否双向
  output_size: 1           # 输出维度
  attention: false         # 是否使用注意力机制

# 训练特定设置
training:
  batch_size: 32           # 批次大小
  epochs: 100              # 训练轮次
  optimizer:
    type: "Adam"           # 优化器类型
    learning_rate: 0.001   # 学习率
    weight_decay: 0.0001   # 权重衰减
  scheduler:
    type: "ReduceLROnPlateau"  # 学习率调度器
    factor: 0.5            # 学习率衰减因子
    patience: 5            # 等待轮次
    min_lr: 0.00001        # 最小学习率
  loss_function: "MSE"     # 损失函数
  early_stopping:
    patience: 20           # 早停等待轮次
    monitor: "val_loss"    # 监控指标

# 评估配置
evaluation:
  metrics: ["MSE", "MAE", "RANK_IC", "Sharpe", "MaxDrawdown"]
  validation_frequency: 1   # 每轮验证频率 