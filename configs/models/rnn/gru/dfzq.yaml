version: "1.0"  # 添加版本字段
# 东方证券GRU模型配置
model_type: "GRU"
model_name: "dfzq_gru"
description: "东方证券自定义GRU模型，包含注意力机制和特征相关性约束"

# 模型架构
architecture:
  input_size: 6           # 输入特征维度 (根据dataset_map中的特征数)
  hidden_size: 64         # 隐藏层大小 (从AGRUModel中获取)
  num_layers: 2           # GRU层数
  dropout: 0.1            # Dropout比率
  bidirectional: false    # 单向GRU
  output_size: 1          # 输出维度
  attention: true         # 使用注意力机制
  feature_extractor: true # 提取特征向量用于相关性计算

# 训练特定设置
training:
  batch_size: 32          # 批次大小
  epochs: 200             # 最大训练轮次 (从代码中的max_epoch)
  sequence_length: 30     # 序列长度 (feature_lag参数)
  optimizer:
    type: "Adam"          # 优化器类型
    learning_rate: 0.0001 # 学习率
  early_stopping:
    patience: 20          # 早停等待轮次 (early_stop_epoch)
    monitor: "rank_ic"    # 监控指标
    mode: "max"           # 最大化rank_ic
  loss_function: "Custom" # 自定义损失函数
  loss_parameters:
    alpha: 0.5           # 相关系数正则化权重

# 评估配置
evaluation:
  metrics: ["RANK_IC", "IC_IR"]
  validation_split: 0.1   # 验证集比例
  validation_frequency: 1  # 每轮评估

# 数据处理
data_processing:
  label_normalization: true  # 标签标准化
  feature_normalization: true # 特征标准化

# 特有配置
dfzq_specific:
  decorrelation: true      # 是否进行特征去相关
  alpha_output: "fv_mean"  # 输出方式：fv_mean或direct
  use_label_norm: true     # 是否对标签进行标准化 