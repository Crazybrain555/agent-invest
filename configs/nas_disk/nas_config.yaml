# NAS 连接配置
nas:
  # 注意: 实际生产中密码等敏感信息建议使用环境变量或 secrets management
  host: "\\space"  # 使用您提供的 NAS 主机/路径
  user: "space\\bsshare"  # 使用您提供的用户名
  password: "!@#$QWERasdf" # 使用您提供的密码
  # base_path 已删除，改为在代码中直接指定完整路径

# 数据源配置
loader:
  overlap_days: 60          # 更新时回溯 3 天，可以根据需要调整
  batch_size: 1000          # 读取文件或写入数据库时的批处理大小
  encoding: "utf-8"         # 假设的 CSV 文件编码，如果不对需要调整
  file_pattern: "forbid.*.csv" # 匹配文件名格式
  date_pattern: 'forbid\.(\d{8})\.csv' # 用于从文件名提取日期的正则表达式 (使用单引号)
  filename_format_string: "forbid.{date}.csv" # New: String for constructing filename from date
  columns: ["stock_code", "signal"] # CSV 文件内容的列名

# 数据库配置
database:
  table_name: "restricted_stock_pool"
  schema: "ai_is" # 假设使用 public schema，如果需要修改请指出
  pk_fields: ["trade_date", "stock_code"] # 定义主键

# 注意：Milestone 1 计划中没有 scheduler 部分，我们将在后续 Milestone 中添加 