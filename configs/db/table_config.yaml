# 代码格式转换规则
code_format_rules:
  # 数据库格式转换规则（用于SQL查询）
  db_format:
    # 移除后缀规则（用于将用户输入的带后缀代码转换为数据库格式）
    remove_suffix:
      type: remove_suffix
      suffixes: [".SZ", ".SH"]
    
    # 添加后缀规则（用于将数据库代码转换为数据库查询格式）
    add_suffix:
      type: add_suffix
      rules:
        - pattern: "^6"
          suffix: ".SH"
        - pattern: "^0|^3"
          suffix: ".SZ"
    
    # Wind专用规则
    remove_suffix_wind:
      type: 'remove_suffix'
      description: '移除Wind股票代码的市场后缀(.SZ/.SH)'
      suffixes: ['.SZ', '.SH', '.BJ', '.SHE', '.SHA']
    
    # 聚源专用规则
    remove_suffix_all:
      type: 'remove_suffix'
      description: '移除所有市场后缀，确保纯数字格式'
      suffixes: ['.SZ', '.SH', '.BJ', '.SHE', '.SHA', 'SZ', 'SH', 'BJ']
    
    # 确保6位数格式(聚源可能需要)
    ensure_6digits:
      type: 'pad_zeros'
      description: '确保股票代码为6位数字格式'
      length: 6
  
  # 输出格式转换规则（用于统一输出格式）
  output_format:
    # 移除所有后缀，统一为6位数字格式
    standardize:
      type: remove_suffix
      suffixes: [".SZ", ".SH", ".BJ", ".SHE", ".SHA", "SZ", "SH", "BJ"]
    
    # 添加后缀规则（如果需要带后缀的输出）
    add_market_suffix:
      type: 'add_suffix'
      description: '根据股票代码规则添加正确的市场后缀'
      rules:
        - pattern: '^(00|30)\\d{4}$'  # 深市股票
          suffix: '.SZ'
        - pattern: '^(60|68)\\d{4}$'  # 上市股票
          suffix: '.SH'
        - pattern: '^(83|43)\\d{4}$'  # 北交所
          suffix: '.BJ'
    
    # 移除后缀，保持纯数字
    remove_all_suffix:
      type: 'remove_suffix'
      description: '移除所有后缀，保持纯数字格式作为标准输出'
      suffixes: ['.SZ', '.SH', '.BJ', '.SHE', '.SHA', 'SZ', 'SH', 'BJ', '.WI', '.CSI']

