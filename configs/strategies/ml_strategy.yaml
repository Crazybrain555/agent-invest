# 机器学习策略配置
strategy_type: "ML"
strategy_name: "ml_strategy"
description: "基于机器学习的量化交易策略"

# 继承基础策略配置
extends: "base_strategy.yaml"

# 模型配置
model:
  type: "LSTM"               # 模型类型
  config_path: "models/rnn/lstm/basic.yaml"  # 模型配置文件路径
  update_frequency: "daily"   # 模型更新频率
  retrain_threshold: 0.1     # 重训练阈值

# 特征工程
feature_engineering:
  technical_indicators:      # 技术指标
    - "MA"
    - "RSI"
    - "MACD"
    - "BB"
  fundamental_indicators:    # 基本面指标
    - "PE"
    - "PB"
    - "ROE"
  market_indicators:         # 市场指标
    - "volatility"
    - "turnover"
    - "momentum"
  feature_lag: 20           # 特征滞后期
  feature_scaling: "standard"  # 特征缩放方式

# 预测设置
prediction:
  horizon: 5                # 预测周期
  confidence_threshold: 0.6  # 置信度阈值
  ensemble_method: "weighted"  # 集成方法
  model_weights:            # 模型权重
    lstm: 0.4
    gru: 0.3
    transformer: 0.3

# 信号处理
signal_processing:
  signal_threshold: 0.5     # 信号阈值
  position_sizing: "risk_parity"  # 仓位分配方法
  rebalance_threshold: 0.1  # 调仓阈值
  stop_loss: 0.05          # 止损比例
  take_profit: 0.1         # 止盈比例

# 信号生成设置
signal:
  smoothing: 5  # 信号平滑窗口大小
  quantile_filter: 0.05  # 过滤掉分位数范围外的信号
  holding_period: 10  # 持仓周期
  minimum_signal_threshold: 0.1  # 最小信号阈值

# 风险控制
risk_control:
  max_position_per_asset: 0.1  # 单个资产最大持仓比例
  volatility_lookback: 20  # 波动率计算回看期
  max_drawdown_threshold: 0.15  # 最大回撤阈值
  var_percentile: 0.05  # VaR百分位
  use_stop_loss: true  # 是否使用止损
  stop_loss_threshold: 0.05  # 止损阈值

# 投资标的
universe:
  selection: "zz500"  # 选股池
  filter:
    min_market_cap: 5e9  # 最小市值（50亿）
    min_turnover: 0.005  # 最小换手率
    exclude_st: true  # 排除ST股票 