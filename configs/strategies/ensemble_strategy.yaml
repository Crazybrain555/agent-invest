# 集成策略配置
strategy_type: "Ensemble"
strategy_name: "ensemble_strategy"
description: "基于多个模型的集成交易策略"

# 继承基础策略配置
extends: "base_strategy.yaml"

# 集成模型配置
ensemble:
  method: "stacking"         # 集成方法: stacking, voting, blending
  base_models:              # 基础模型列表
    - type: "LSTM"
      config_path: "models/rnn/lstm/attention.yaml"
      weight: 0.3
    - type: "GRU"
      config_path: "models/rnn/gru/dfzq.yaml"
      weight: 0.3
    - type: "Transformer"
      config_path: "models/transformer/informer.yaml"
      weight: 0.2
    - type: "CNN"
      config_path: "models/cnn/temporal.yaml"
      weight: 0.2
  meta_model:               # 元模型配置
    type: "LogisticRegression"
    params:
      C: 1.0
      penalty: "l2"
      solver: "lbfgs"

# 特征工程
feature_engineering:
  technical_indicators:      # 技术指标
    - "MA"
    - "RSI"
    - "MACD"
    - "BB"
    - "KDJ"
    - "ATR"
  fundamental_indicators:    # 基本面指标
    - "PE"
    - "PB"
    - "ROE"
    - "ROA"
    - "EPS"
  market_indicators:         # 市场指标
    - "volatility"
    - "turnover"
    - "momentum"
    - "liquidity"
  feature_lag: 30           # 特征滞后期
  feature_scaling: "standard"  # 特征缩放方式

# 预测设置
prediction:
  horizon: 10               # 预测周期
  confidence_threshold: 0.7  # 置信度阈值
  ensemble_method: "weighted"  # 集成方法
  dynamic_weighting: true   # 是否动态调整权重
  weight_update_frequency: "weekly"  # 权重更新频率

# 信号处理
signal_processing:
  signal_threshold: 0.6     # 信号阈值
  position_sizing: "risk_parity"  # 仓位分配方法
  rebalance_threshold: 0.15  # 调仓阈值
  stop_loss: 0.05          # 止损比例
  take_profit: 0.1         # 止盈比例
  trailing_stop: true      # 是否使用追踪止损
  trailing_stop_pct: 0.02  # 追踪止损比例 