# Space 网络驱动器连接配置
nas:
  # 注意: 实际生产中密码等敏感信息建议使用环境变量或 secrets management
  host: "\\\\space"  # Space 网络驱动器主机路径
  user: "space\\bsshare"  # 网络驱动器用户名
  password: "!@#$QWERasdf" # 网络驱动器密码
  # 具体路径在代码中直接指定完整路径

# 网络驱动器路径配置
paths:
  signal_path: "\\\\space\\signal"
  forbid_path: "\\\\space\\forbid" 
  theme_path: "\\\\space\\alpha\\dyn_broad_zz800_cne5citics_size_beta\\subtheme"

# 数据源配置
loader:
  overlap_days: 20          # 默认回溯天数
  batch_size: 1000          # 读取文件或写入数据库时的批处理大小
  encoding: "utf-8"         # CSV 文件编码
  max_retries: 3            # 网络连接重试次数
  retry_delay: 5            # 重试间隔（秒）
  
  # 信号数据配置
  signal:
    file_pattern: "*.csv"
    date_extraction: "filename"  # 从文件名提取日期
    columns: ["stk_code", "signal_value"]  # 默认列名
    
  # 主题数据配置  
  theme:
    file_pattern: "*.csv"
    date_extraction: "filename"
    columns: ["stk_code", "theme_value"]
    
  # 禁投池数据配置
  forbid:
    file_pattern: "forbid.*.csv"
    date_pattern: 'forbid\.(\d{8})\.csv'
    filename_format_string: "forbid.{date}.csv"
    columns: ["stock_code", "signal"]

# 数据库配置
database:
  # 表名配置
  signal_table_prefix: "signal_"
  theme_table_prefix: "theme_"
  forbid_table_name: "forbid_pool"
  
  # 数据库schema
  schema: "ai_is"
  
  # 主键字段定义
  pk_fields: ["trade_date", "stock_code"]
  
  # 表结构配置
  table_config:
    numeric_type: "float"
    numeric_precision: [20, 8]  # DECIMAL(20,8)
    string_length: 15           # VARCHAR(15) for stock codes
    
# 调度配置
scheduler:
  enabled: true
  schedule:
    hour: 1                    # 默认凌晨1点执行
    minute: 0
  timezone: "Asia/Shanghai"
  
  # 重试配置
  max_job_retries: 3
  job_retry_delay: 300         # 5分钟

# 处理配置
processing:
  # 数据验证
  validate_data_types: true
  skip_invalid_records: true
  
  # 数据清洗
  remove_duplicates: true
  handle_missing_values: true
  
  # 性能设置
  use_parallel: true
  max_workers: 4
  chunk_size: 1000
  
  # 内存管理
  max_memory_usage_gb: 8
  gc_frequency: 100

# 日志配置
logging:
  level: "INFO"
  log_to_file: true
  log_file_pattern: "space_pipeline_{date}.log"
  max_log_files: 30
  rotate_logs: true
  max_log_size_mb: 100

# 监控配置
monitoring:
  enabled: false
  track_processing_time: true
  track_memory_usage: true
  collect_metrics: true
  metrics_retention_days: 90 