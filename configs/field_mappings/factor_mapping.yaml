# ============================================================================
# Space Signals 因子分类映射配置（二级分类版本 - 带详细注释）
# ============================================================================
#
# 配置说明：
# 1. 支持二级分类结构：一级分类 -> 二级分类 -> [signals]
# 2. 每个二级分类包含 15-40 个因子
# 3. 根据因子业务含义进行合理分组
# 4. 每个因子添加了简要说明，便于理解和使用
#
# 表命名规则：
# - 二级分类: quantitative_{level1}_{level2}_signals
# - 示例: growth.profitability -> quantitative_growth_profitability_signals
#
# 更新日期: 2024-10-22
# ============================================================================

# ==================== 成长类因子 (Growth) ====================
# 衡量企业盈利增长、收入扩张和未来增长潜力的指标
growth:
  
  # --------------------------------------------------
  # 盈利增长和质量（32个因子）
  # 关注净利润、营业利润、ROE、ROA等盈利指标的同比增长和质量
  # --------------------------------------------------
  profitability:
    - nde2p              # 季度净利润同比变化占总市值比（含快报预告）
    - ne2e_q             # 季度净利润同比增长率（含快报预告）
    - npegl              # 同pegl（未来2年预期增长率/PE，含快报预告）
    - sup_con_np_yg      # 定期报告（含预告快报）相对分析师预测数据的增长
    - de2p               # 季度净利润同比变化/总市值
    - nqdroe             # 季度ROE同比变化（含快报预告）
    - nfes1              # 净利润同比变化/总资产（含快报预告）
    - opg_q              # 季度营业利润同比增长率
    - qdroe              # 季度ROE同比变化
    - sue                # 历史季度盈利惊喜（净利润同比变化的Z值）
    - fes1               # 每股季度净利润同比变化占每股总资产比例
    - kfes1              # 每股季度扣非净利润同比变化占每股总资产比例
    - kqdroa             # 扣非季度ROA同比变化
    - kqdroe             # 扣非季度ROE同比变化
    - npegs              # 同pegs（未来1年预期增长率/PE，含快报预告）
    - qdroa              # 季度ROA同比变化
    - rrqop_qcpacf       # 营业利润对资本支出的残差回归（特质利润）
    - rrqop_qncfoa       # 营业利润对经营现金流的残差回归（特质利润）
    - de2e               # TTM净利润同比增长率
    - npg_q              # 季度净利润同比增长率（分母最小1000万）
    - npg_ttm            # TTM净利润同比增长率（分母最小1000万）
    - npg3_ttm           # TTM净利润相比3年前的增长率
    - qop_stb            # 8期季度营业利润同比增长率均值/标准差
    - qop_acc            # 8期季度营业利润对时间回归的二次项系数
    - qop_dsd            # 一阶差分（8期季度营业利润同比增长率均值/标准差）
    - qe_stb             # 8期季度净利润同比增长率均值/标准差
    - roeg_ttm           # TTM ROE同比变化
    - epsg_ttm           # TTM EPS同比变化
    - rqnp_rqcpbe        # 季度净利润同比增长率-季度职工薪酬同比增长率
    - rqop_rqcpbe        # 季度营业利润同比增长率-季度职工薪酬同比增长率
    - rqop_rqlgae        # 季度营业利润同比增长率-季度管理费用同比增长率
    - rqop_rcpg          # 季度营业利润同比增长率-季度采购商品同比增长率
  
  # --------------------------------------------------
  # 收入和资产增长（31个因子）
  # 关注营业收入、总资产、经营现金流等指标的增长和稳定性
  # --------------------------------------------------
  revenue_asset:
    - da2a               # 总资产季度环比增长率
    - suoi               # 季度营业收入-营业成本的Z值（8期）
    - qop2qlgae          # 季度营业利润/季度管理费用
    - dqop2qcpbe         # Delta季度营业利润/季度职工薪酬
    - nds2ev             # 营业收入同比变化/EV（含快报预告）
    - qtor2qtoc          # 季度营业总收入/季度营业总成本
    - sup_con_np         # 定期报告（不含预告快报）相对分析师预测数据的增长
    - ds2ev              # 季度营业收入同比变化/EV
    - ar_over1           # 异常隔夜回报（含快报预告）
    - nqcsg              # 季度营业总收入同比增长率（含快报预告）
    - ar_over            # 异常隔夜回报
    - ds2p               # 营业收入同比变化/总市值
    - org_ttm            # TTM营业收入同比增长率
    - da2ev              # 总资产年度同比变化/EV
    - opg_ttm            # TTM营业利润同比增长率
    - dafc2ia            # 预收款项变动/无形资产
    - cfg_ttm            # TTM经营性现金流净额同比增长率
    - qcsg               # 季度营业收入同比增长率
    - con_np_yoy_roll    # 滚动一致预期净利润同比增长率
    - smarg              # 营业收入-应收账款变动的Z值（16期）
    - sus                # 营业收入同比变化的Z值（8期）
    - fes2               # 每股季度税费同比变化占每股总资产比例
    - ffretnind1         # 财报公布日前后相对一级行业的特定回报
    - ds2s               # 季度营业收入环比增长率
    - con_or_yoy_roll    # 滚动营业收入同比增长率
    - rgrowth            # Barra增长因子
    - supad              # 预收账款同比变化/平均总资产（Z值，16期）
    - ffretn             # 财报公布日前后相对二级行业的特定回报
    - qor_stb            # 8期季度营业收入同比增长率均值/标准差
    - qor_dsd            # 一阶差分（8期季度营业收入同比增长率均值/标准差）
    - qor_acc            # 8期季度营业收入对时间回归的二次项系数
  
  # --------------------------------------------------
  # 预期和趋势（16个因子）
  # 基于分析师预期和历史回归计算的增长趋势指标
  # --------------------------------------------------
  forecast_trend:
    - pegl               # 未来2年一致预期净利润年化增长率/PE
    - pegs               # 未来1年一致预期净利润年化增长率/PE
    - con_peg_roll       # 个股滚动净利润复合增长率/未来滚动PE
    - reg_con_or         # 回归计算一致预期营业收入复合增长率
    - reg_con_or1        # 回归计算一致预期营业收入复合增长率（调整平均收入最低1亿）
    - fg1                # 1年预测净利润复合增长率（仅年报）
    - fg2                # 2年预测净利润复合增长率（仅年报）
    - fg3                # 3年预测净利润复合增长率（仅年报）
    - sgro3              # 过去3年营业收入回归增长率（仅年报）
    - sgro5              # 过去5年营业收入回归增长率（仅年报）
    - reg_con_np         # 回归计算2年预期净利润复合增长率
    - reg_con_np1        # 回归计算2年预期净利润复合增长率（分母最小5000万）
    - egro3              # 过去3年净利润回归增长率（仅年报）
    - egro5              # 过去5年净利润回归增长率（仅年报）
    - con_npcgrate_2y_roll  # 滚动一致预期净利润2年复合增长率
    - egibs              # 一致预期净利润增长率（明年/当年）

# ==================== 分析师类因子 (Analyst) ====================
# 反映分析师覆盖度、评级变化、盈利预测修正等市场关注度指标
analyst:
  
  # --------------------------------------------------
  # 覆盖度和评级（22个因子）
  # 分析师覆盖数量、评级变化、评级方向加权等指标
  # --------------------------------------------------
  coverage_rating:
    - cvg_og1            # 1个月覆盖度（机构数）
    - cvg_og2            # 2个月覆盖度（机构数）
    - cvg_og3            # 3个月覆盖度（机构数）
    - cvg1               # 1个月覆盖度（同一机构不同日期算多次）
    - cvg2               # 2个月覆盖度（同一机构不同日期算多次）
    - cvg3               # 3个月覆盖度（同一机构不同日期算多次）
    - eps_variability2   # n个月分析师分歧度（至少3家覆盖）
    - darec              # 评级变动加权（180工作日，30半衰期）
    - darec_100_60       # 评级变动加权（100工作日，60半衰期）
    - darec_20_10        # 评级变动加权（20工作日，10半衰期）
    - darec_l            # 评级变动加权（180工作日，60半衰期）
    - darec_s            # 评级变动加权（短期）
    - drec               # 最新一致预期评级变化（本月-上月）
    - recud              # 评级方向加权（180工作日，30半衰期）
    - recud_180_30       # 评级方向加权（180工作日，30半衰期）
    - recud_20_10        # 评级方向加权（20工作日，10半衰期）
    - recud_l            # 评级方向加权（180工作日，60半衰期）
    - recud_s            # 评级方向加权（180工作日，10半衰期）
    - rec                # 最新一致预期评级（90天内3家加权）
    - rec2               # 最新一致预期评级（90天内1家加权）
    - brkgs              # 券商金股（根据调入调出家数打分）
    - intretp            # 内部分析师（1个月内调入调出持有分别打分）
  
  # --------------------------------------------------
  # 盈利预测修正（17个因子）
  # 分析师盈利预测的变化方向、幅度和分歧度
  # --------------------------------------------------
  earnings_revision:
    - darev              # 盈利预测同比变化/总市值（90天，30半衰期）
    - darev_120_60       # 盈利预测同比变化/总市值（120天，60半衰期）
    - darev_40_10        # 盈利预测同比变化/总市值（40天，10半衰期）
    - darev_60_20        # 盈利预测同比变化/总市值（60天，20半衰期）
    - darev_l            # 盈利预测同比变化/总市值（120天，60半衰期）
    - darev_s            # 盈利预测同比变化/总市值（40天，10半衰期）
    - grev3              # 盈利预测变动（相比3个月前）
    - rev12              # 过去20天盈利预测相比前一天加权变化值/总市值
    - revudsratio        # EPS扩散度（上调数-下调数）/（上调数+下调数）
    - revud              # 盈利预测方向变化（90天，15半衰期）
    - revud_120_60       # 盈利预测方向变化（120天，60半衰期）
    - revuds             # 盈利预测方向变化（盈利变动/总市值，90天，30半衰期）
    - revuds_120_60      # 盈利预测方向变化（120天，60半衰期）
    - revuds_40_10       # 盈利预测方向变化（40天，10半衰期）
    - revuds_60_20       # 盈利预测方向变化（60天，20半衰期）
    - revuds_l           # 盈利预测方向变化（120天，60半衰期）
    - revuds_s           # 盈利预测方向变化（60天，10半衰期）

# ==================== 价值类因子 (Value) ====================
# 衡量企业估值水平的指标，包括市净率、市盈率、市销率等
value:
  
  # --------------------------------------------------
  # 综合估值（26个因子）
  # 涵盖PB、PS、PE、现金流、股息率等多维度估值指标
  # --------------------------------------------------
  valuation:
    - b12p               # 分析师预测下一年PB
    - b23p               # 分析师预测第二年PB
    - b2pm               # 市净率（使用上月末总市值）
    - b2p                # 市净率（最新）
    # - b2paddcor20        # 市净率-相关度量  # NOT IN DB
    - con_pb_roll        # 朝阳永续一致预期PB
    - con_ps_roll        # 朝阳永续一致预期PS
    - nb2p               # 市净率（考虑快报）
    - nsale2ev           # 营业总收入/EV（考虑快报预告）
    - s12ev              # 分析师预测下一年营业收入/EV
    # - s12evaddcor20      # s12ev-相关度量  # NOT IN DB
    - s23ev              # 分析师预测第二年营业收入/EV
    - sale2ev            # 营业总收入/EV
    # - sale2evaddcor20    # sale2ev-相关度量  # NOT IN DB
    - sale2p             # 营业总收入/总市值
    - ta2ev              # 总资产/EV
    - aeb2ev             # 调整后经营现金流/EV（扣除资本支出）
    - cfo2ev             # 经营活动产生的现金流量净额/EV
    - cfo2p              # 经营活动产生的现金流量净额/总市值
    - d2p                # 股息率（追溯12个月分红总额）
    - con_pe_roll        # 朝阳永续一致预期PE
    - e2p                # 市盈率（归母净利润/总市值）
    - fy12p              # 分析师预测下一年净利润/总市值
    - fy23p              # 分析师预测第二年净利润/总市值
    - ke2p               # 扣非市盈率（扣非净利润/总市值）
    - ne2p               # 市盈率（考虑快报预告）

# ==================== 情绪类因子 (Sentiment) ====================
# 反映市场情绪、价格动量、波动率和流动性的综合指标
sentiment:
  
  # --------------------------------------------------
  # 波动率指标（37个因子）
  # 价格波动率、成交量波动率、残差波动率、beta等
  # --------------------------------------------------
  volatility:
    - highlow12m         # 12个月最高价/最低价
    - highlow1m          # 1个月最高价/最低价
    - highlow24m         # 24个月最高价/最低价
    - highlow3m          # 3个月最高价/最低价
    - highlow6m          # 6个月最高价/最低价
    - i_volatility       # 残差波动率
    - ivo                # 残差波动率
    - ivo_ff12m          # 过去12个月残差波动率（22交易日）
    - ivo_ff1m           # 过去1个月残差波动率（22交易日）
    - ivo_ff24m          # 过去24个月残差波动率（22交易日）
    - ivo_ff3m           # 过去3个月残差波动率（22交易日）
    - ivo_ff6m           # 过去6个月残差波动率（22交易日）
    - ivr                # 过去1个月残差波动率（22交易日）
    - ivr_ff12m          # 过去12个月R方（22交易日）
    - ivr_ff1m           # 过去1个月R方（22交易日）
    - ivr_ff24m          # 过去24个月R方（22交易日）
    - ivr_ff3m           # 过去3个月R方（22交易日）
    - ivr_ff6m           # 过去6个月R方（22交易日）
    - volatility_actual12m  # 过去12个月真实波幅均值
    - volatility_actual1m   # 过去1个月真实波幅均值
    - volatility_actual24m  # 过去24个月真实波幅均值
    - volatility_actual3m   # 过去3个月真实波幅均值
    - volatility_actual6m   # 过去6个月真实波幅均值
    - volatility12m      # 过去12个月波动率（22交易日）
    - volatility1m       # 过去1个月波动率（22交易日）
    - volatility24m      # 过去24个月波动率（22交易日）
    - volatility3m       # 过去3个月波动率（22交易日）
    - volatility6m       # 过去6个月波动率（22交易日）
    - volume_volatility12m  # 成交量波动率12个月
    - volume_volatility1m   # 成交量波动率1个月
    - volume_volatility24m  # 成交量波动率24个月
    - volume_volatility3m   # 成交量波动率3个月
    - volume_volatility6m   # 成交量波动率6个月
    - maxret33           # 最近3个月最大3日收益率均值
    - maxret66           # 最近6个月最大6日收益率均值
    - maxret11           # 最近1个月日收益率最大值
    - beta3m             # 个股收益率相对中证全指过去3个月回归系数
  
  # --------------------------------------------------
  # 动量指标（23个因子）
  # 价格动量、排名动量、波动率调整后动量等
  # --------------------------------------------------
  momentum:
    - cto6m              # 隔日动量（剔除最近1月后5个月）
    - cthl6m             # 高低开动量（剔除最近1月后5个月）
    - cthl9m             # 高低开动量（剔除最近1月后8个月）
    - cto12m             # 隔日动量（剔除最近1月后11个月）
    - cto9m              # 隔日动量（剔除最近1月后8个月）
    - drmom12m           # 收益率排名动量（剔除最近1月后11个月）
    - drmom9m            # 收益率排名动量（剔除最近1月后8个月）
    - cthl12m            # 高低开动量（剔除最近1月后11个月）
    - cto24m             # 隔日动量（剔除最近1月后23个月）
    - drmom6m            # 收益率排名动量（剔除最近1月后5个月）
    - cthl24m            # 高低开动量（剔除最近1月后23个月）
    - drmom24m           # 收益率排名动量（剔除最近1月后23个月）
    - momvol7m           # 过去7个月波动率调整后动量
    - momentum_t12       # 过去1年价格对时间回归的t值（剔除最近1月）
    - momentum           # 风险模型动量因子
    - momvol10m          # 过去10个月波动率调整后动量
    - demom8             # 过去8个月对数收益率和（剔除最近1月，头尾减半）
    - demom7             # 过去7个月对数收益率和（剔除最近1月，头尾减半）
    - demom9             # 过去9个月对数收益率和（剔除最近1月，头尾减半）
    - momvol12m          # 过去12个月波动率调整后动量
    - demom10            # 过去10个月对数收益率和（剔除最近1月，头尾减半）
    - m52w               # 当前价格/过去52周最高价格
    - momvol24m          # 过去24个月波动率调整后动量
  
  # --------------------------------------------------
  # 价格和收益率（21个因子）
  # 短中长期收益率、均价比、协整关系等
  # --------------------------------------------------
  price_return:
    - mad120             # 当前价/20日均价-1
    - mad560             # 5日均价/60日均价
    - pairs              # 个股对行业协整关系（均值回复）
    - pairs_l            # 个股对行业协整关系（长期）
    - price2vol          # 上交易日分钟收盘价与成交量变化相关系数
    - ret12m             # 过去12个月涨跌幅
    - ret12m_1m          # 过去12个月涨跌幅（剔除最近1月）
    - ret1m              # 过去1个月涨跌幅
    - ret24m             # 过去24个月涨跌幅
    - ret24m_1m          # 过去24个月涨跌幅（剔除最近1月）
    - ret3m              # 过去3个月涨跌幅
    - ret3m_1m           # 过去3个月涨跌幅（剔除最近1月）
    - ret6m              # 过去6个月涨跌幅
    - ret6m_1m           # 过去6个月涨跌幅（剔除最近1月）
    - revs               # 价格反转（最近40日回报时间加权）
    - revsTA             # 单笔成交金额反转（高低单笔金额差异）
    - revsTV             # 单笔成交量反转（高低单笔量差异）
    - spb                # 类似pairs（收益率回归相关性分组）
    - tprtn1             # 一致预期潜在收益率（3家以上）
    - tprtn2             # 一致预期潜在收益率（1家以上）
    - tskew              # 最近1年收益率偏态
  
  # --------------------------------------------------
  # 价值反转（21个因子）
  # 估值指标的历史相对位置和短期变化
  # --------------------------------------------------
  value_reversal:
    - mom1_con_pb_roll   # 最新/1月前一致预期滚动BP-1
    - mom1_con_ps_roll   # 最新/1月前一致预期滚动SP-1
    - mom3_con_pb_roll   # 最新/3月前一致预期滚动BP-1
    - nre2p              # 过去1年相对nEP
    - mom1_con_pe_roll   # 最新/1月前一致预期滚动EP-1
    - mom3_con_ps_roll   # 最新/3月前一致预期滚动SP-1
    - rfy12p             # fy12p当前值相对最近1年Z值
    - mom3_con_pe_roll   # 最新/3月前一致预期滚动EP-1
    - rcon_pe_roll       # 一致预期滚动PE当前值相对最近1年Z值
    - rcon_pb_roll       # 一致预期滚动PB当前值相对最近1年Z值
    - rb2p               # 历史相对BP
    - rcon_ps_roll       # 一致预期滚动PS当前值相对最近1年Z值
    - re2p               # E2P当前值相对最近1年Z值
    - rpegl              # pegl当前值相对最近1年Z值
    - nrpegl             # 同rpegl
    - rcon_peg_roll      # 一致预期滚动PEG当前值相对最近1年Z值
    - rpegs              # pegs当前值相对最近1年Z值
    - nrpegs             # 同rpegs
    - rcon_eps_roll      # 一致预期滚动EPS当前值相对最近1年Z值
    - nrb2p              # 过去1年相对nBP
    - mom3_con_eps_roll  # Con_EPS环比增长率（本月/前一月-1）
  
  # --------------------------------------------------
  # 流动性（28个因子）
  # 换手率、成交额、非流动性、买卖循环率等
  # --------------------------------------------------
  liquidity:
    - astd12m            # 12个月成交额/收益率标准差
    - astd1m             # 1个月成交额/收益率标准差
    - astd24m            # 24个月成交额/收益率标准差
    - astd3m             # 3个月成交额/收益率标准差
    - astd6m             # 6个月成交额/收益率标准差
    - davol              # 最近20日换手率/最近60日换手率（取负）
    - davol_floatshr     # 流通股本davol
    - davol_freeshr      # 自由流通股本davol
    - illiq              # 非流动性因子（单位成交金额的涨跌幅）
    - liquidty           # 0.35·STOM+0.35·STOQ+0.30·STOA
    - lowprice           # 1/昨日收盘价
    - lsf                # 20日非流动性abs(收益率/成交数量)
    - mad_amount_20240   # 过去20日/过去240日日均成交额
    - mad_amount_2060    # 过去20日/过去60日日均成交额
    - mad_volume_20240   # 过去20日/过去240日日均成交量
    - mad_volume_2060    # 过去20日/过去60日日均成交量
    - turnover_amount12m # 最近12个月买卖循环率（取负）
    - turnover_amount1m  # 最近1个月买卖循环率（取负）
    - turnover_amount24m # 最近24个月买卖循环率（取负）
    - turnover_amount3m  # 最近3个月买卖循环率（取负）
    - turnover_amount6m  # 最近6个月买卖循环率（取负）
    - turnover12m        # 过去12个月换手率
    - turnover1m         # 过去1个月换手率
    - turnover24m        # 过去24个月换手率
    - turnover3m         # 过去3个月换手率
    - turnover6m         # 过去6个月换手率
    - vol                # 最近40天加权换手率
    - vol_freeshr        # 自由流通股本换手率

# ==================== 质量类因子 (Quality) ====================
# 衡量企业财务质量、盈利能力、运营效率和安全性的指标
quality:
  
  # --------------------------------------------------
  # 现金流和杠杆（27个因子）
  # 应计利润、流动比率、现金比率、杠杆率、破产风险等
  # --------------------------------------------------
  cashflow_safety:
    - abacc              # 应计利润回归残差（剔除营业利润为负）
    - abaccall           # 应计利润回归残差（全样本）
    - acc1               # TTM(营业利润-经营现金流)/平均总资产
    - acca               # (TTM经营现金流-TTM净利润)/平均总资产
    - ccr                # 现金流动负债比率=TTM经营现金流/平均流动负债
    - ccrd               # 现金流动负债比率同比变化
    - cd2d               # 流动负债/总负债
    # - cr                 # 现金比率=(现金+交易性金融资产)/流动负债  # NOT IN DB
    # - crd                # 现金比率同比变化  # NOT IN DB
    # - cur                # 流动比率=流动资产/流动负债  # NOT IN DB
    # - curd               # 流动比率同比变化  # NOT IN DB
    - depad              # 预收款项同比变化占总资产比
    - fcf                # 调整后自由现金流/平均总资产
    - ocf2sale_q         # 季度经营现金流/季度营业收入
    - ocf2ta             # 经营现金流/有形资产
    - pio                # 10项财务指标综合打分
    # - qr                 # 速动比率=(流动资产-存货-预付等)/流动负债  # NOT IN DB
    # - qrd                # 速动比率同比变化  # NOT IN DB
    - bab                # 相对市场的-beta（低波动因子）
    - cfovol2a           # 现金流波动率=5年现金流波动率/平均总资产
    - evol               # 12个季度ROE标准差
    - evol2a3            # 利润总额波动率=3年利润波动率/平均总资产
    - evol2a             # 利润总额波动率=5年利润波动率/平均总资产
    - lev                # -(借款+少数股东权益+优先股)/总资产
    - o                  # 9项杠杆指标衡量破产概率
    - svol2a             # 营业收入波动率=5年营收波动率/平均总资产
    - z                  # (现金+未分配利润+营业收入+总利润)/总资产
  
  # --------------------------------------------------
  # 运营效率（15个因子）
  # 周转率、管理层持股、股东结构等
  # --------------------------------------------------
  operating_efficiency:
    - dirn               # 董事会委员数量
    - ffsp               # 流通股本数/总股本数
    - fhp                # 第1大股东持股比例
    - invt               # 存货周转率=营业成本/平均存货余额
    - invtd              # 存货周转率同比变化
    - mginc3             # 管理层最新前三薪酬之和
    - mgincome           # 管理层最新总薪酬
    - mgshr              # 管理层最新总持股数量
    - ocfa               # 产能利用率提升（营业成本对固定资产残差）
    - rat                # 应收周转率=营业收入/(应收账款+应收票据)
    - ratd               # 应收周转率同比变化
    - shn                # 股东总数
    - sthp               # 第2-10大股东持股比例
    - tat                # 总资产周转率=营业收入/总资产
    - tatd               # 总资产周转率同比变化
  
  # --------------------------------------------------
  # 盈利质量（22个因子）
  # ROA、ROE、毛利率、扣非等盈利质量指标及其变化
  # --------------------------------------------------
  profit_quality:
    - dcfoa              # (调整后经营现金流-5年前)/平均总资产
    - dgmar              # (营业利润-5年前营业利润)/总收入
    - dgpoa              # (营业利润-5年前营业利润)/总资产
    - dqgpoa             # 毛利率同比变化（季度）
    - droa               # (营业利润+财务费用-5年前)/总资产
    - droe               # (净利润-5年前净利润)/所有者权益
    - dygpoa             # 毛利率同比变化（年度）
    - e2c_q              # 季度净利润/营业总成本
    - gmar               # TTM营业利润/平均营业收入
    - gpm_q              # 季度毛利率=(营业收入-营业成本)/营业收入
    - gpoa               # 营业利润/平均总资产
    - intcov             # TTM财务费用/TTM EBIT
    - knp2np_q           # 季度扣非净利润/净利润
    - kroa               # 扣非ROA=(营业利润-其他经营收益)/平均总资产
    - kroe               # 扣非ROE=(营业利润-其他经营收益)/平均净资产
    - op2tp_q            # 季度营业利润/总利润
    - roa                # TTM(营业利润+财务费用)/平均总资产
    - roa_q              # 季度(营业利润+财务费用)/平均总资产
    - roe                # 归母净利润(TTM)/归母所有者权益
    - roe_q              # 季度净利润/股东权益
    - roic               # (EBIT-TAX)/(股东权益+有息负债-现金等价物)
    - sugm               # 毛利率年度同比的16期Z值

# ==================== 另类因子 (Alternative) ====================
# 高频交易数据、机构持仓、专利数据等另类数据源因子
alternative:
  
  # --------------------------------------------------
  # 高频交易（32个因子）
  # 日内分钟级别的价格、成交量、波动特征等
  # --------------------------------------------------
  high_frequency:
    - amresid_amount     # 上午成交额与行业回归残差和（过去20天平均）
    - apm                # 上下午收益率残差相减标准化后与过去20天回归残差
    - high_beta          # 日内分钟收益率对市场平均收益率回归系数
    - high_dev           # 价量相关系数cor(vol,price)
    - high_hprice        # 日内最高价首次出现时间点
    - High_PVcor         # 日内价格和成交量相关系数
    - high_pvi           # 放量时收益率之和sum(ret*(vol_t>vol_t-1))
    - high_RetDV         # 日内分钟收益率下行波动率占比
    - high_RetKurt       # 日内分钟收益率峰度
    - high_RetSkew       # 日内分钟收益率偏度
    - high_RetVar        # 日内分钟收益率方差
    - high_smart         # VWAP(SMART)/VWAP(ALL)，聪明钱识别
    - high_vol_close     # 收盘前15分钟成交量占比
    - high_vol_open      # 开盘后15分钟成交量占比
    - High_VolKurt       # 日内分钟成交量峰度
    - high_VolSkew       # 日内分钟成交量偏度
    - high_VolVar        # 日内分钟成交量方差
    - high_vr            # 5分钟成交量方差/10分钟成交量方差
    - MinuVol_call       # 集合竞价成交量占比
    - MinuVol_coc        # 集合竞价+开盘25分钟+收盘前10分钟成交量占比
    - MinuVol_diff       # 中间时间段-两端成交量占比
    - MinuVol_intra      # 10:30-14:00成交量占比
    - MinuVol_rate       # 两端成交量占比/中间成交量占比
    - NCV                # 空头一致性交易因子（下跌一致性交易）
    - neg_smart_money    # 下跌聪明钱成交量
    - ocavp              # 上午集合竞价成交量占全天占比
    - PCV                # 多头一致性交易因子（上涨一致性交易）
    - pos_smart_money    # 上涨聪明钱成交量
    - price2vol          # 日内价格和成交量相关系数
    - r2_amount_pm       # 下午成交额与行业回归R方
    - residpos_amount_pm # 全天成交额与行业回归正残差和（过去20天平均）
    - TCV                # 一致性交易因子（K线实体较大部分）
  
  # --------------------------------------------------
  # 机构持仓和专利（21个因子）
  # 基金持仓、陆股通、专利数据等
  # --------------------------------------------------
  institutional_patent:
    - fundkey            # 核心持股（各行业基金持仓比例前N名）
    - indlead            # 行业龙头（市值成交额营收营利润平均排名前3）
    - lgtratio           # 陆股通持股占流通股本比例
    - PA4_1              # 前4年内公开的发明公开有效专利数
    - PA4_10             # 前4年内实用新型有效专利IPC分类号数量平均值
    - PA4_12             # 前4年内发明公开有效专利说明书总字数
    - PA4_14             # 前4年内发明授权有效专利说明书总字数
    - PA4_15             # 前4年内发明公开有效专利说明书字数平均值
    - PA4_18             # 前4年内发明公开有效专利权利要求总项数
    - PA4_21             # 前4年内发明公开有效专利权利要求平均项数
    - PA4_24             # 前4年内发明公开有效专利独权总项数
    - PA4_26             # 前4年内发明授权有效专利独权总项数
    - PA4_30             # 前4年内发明公开有效专利说明书附图总数
    - PA4_32             # 前4年内发明授权有效专利说明书附图总数
    - PA4_36             # 前4年内发明公开摘要总字数
    - PA4_6              # 前4年内发明公开有效专利IPC分类号总数
    - Pan_60             # 某公司所有有效专利在过去60年被引用次数
    - Pn_60              # 某公司所有专利在过去60年被引用次数
    - lowopen_percent    # 股价相对昨日收盘价低开幅度
    - xqfoc              # 雪球关注度（2019年后不再更新）
    - focusrate          # 雪球关注度（2019年后不再更新）

# ============================================================================
# 配置统计：
# 
# ✅ 成长类 (Growth): 3个二级分类, 79个因子
#   - profitability: 32个因子 - 盈利增长和质量
#   - revenue_asset: 31个因子 - 收入和资产增长
#   - forecast_trend: 16个因子 - 预期和趋势
#
# ✅ 分析师类 (Analyst): 2个二级分类, 39个因子
#   - coverage_rating: 22个因子 - 覆盖度和评级
#   - earnings_revision: 17个因子 - 盈利预测修正
#
# ✅ 价值类 (Value): 1个二级分类, 26个因子
#   - valuation: 26个因子 - 综合估值
#
# ✅ 情绪类 (Sentiment): 5个二级分类, 130个因子
#   - volatility: 37个因子 - 波动率指标
#   - momentum: 23个因子 - 动量指标
#   - price_return: 21个因子 - 价格和收益率
#   - value_reversal: 21个因子 - 价值反转
#   - liquidity: 28个因子 - 流动性
#
# ✅ 质量类 (Quality): 3个二级分类, 64个因子
#   - cashflow_leverage: 27个因子 - 现金流和杠杆
#   - operating_efficiency: 15个因子 - 运营效率
#   - profit_quality: 22个因子 - 盈利质量
#
# ✅ 另类 (Alternative): 2个二级分类, 53个因子
#   - high_frequency: 32个因子 - 高频交易
#   - institutional_patent: 21个因子 - 机构持仓和专利
#
# ============================================================================
# 总计: 6个一级分类, 16个二级分类, 391个因子
#
# 二级分类因子数量分布：
# - 30-40个: 4个分类 ✅
# - 20-30个: 9个分类 ✅
# - 15-20个: 3个分类 (略少但逻辑清晰，保持独立)
#
# 所有分类都满足业务含义清晰、相关性强的要求
# ============================================================================
