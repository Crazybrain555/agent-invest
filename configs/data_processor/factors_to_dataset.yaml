# =====================================================
# 因子预处理配置文件 - factors_to_dataset.yaml
# =====================================================
# 
# 此配置文件定义了因子数据预处理的缺失值处理策略
# 支持前缀匹配：配置中的字段名可以匹配所有以该名称开头的因子
#
# 处理策略：
# 1. 价格类因子：保持NaN不填充，让后续代码drop掉缺失行
# 2. 成交量类因子：直接填充0  
# 3. 技术类因子：直接填充0
# 4. 股息率：前向填充，仍NaN则填充0
# 5. 财务指标：前向填充，仍NaN则用当日中位数填充
# 6. 状态类因子：前向填充，仍NaN则用行业中位数填充
# 7. 另类因子：直接填充0
# 8. 百分比*100字段：先转换(/100-1)，再填充0
#
# =====================================================

# 版本信息
version: "2.2.0"
description: "因子预处理配置 - 价格类因子保持NaN，避免0填充导致的标准化异常"

# =====================================================
# 因子分类配置（按处理策略分类）
# =====================================================

factor_categories:
  
  # ----------------------------------------------------
  # 价格类因子：保持NaN不填充
  # ----------------------------------------------------
  # 包含：价格相关的市场数据
  # 处理逻辑：NaN → 保持NaN（让后续代码drop掉缺失行）
  # 原因：价格NaN说明数据确实缺失，填充0会导致标准化异常
  price:
    description: "价格相关数据，缺失保持NaN，避免0填充导致标准化异常"
    # fill_strategy: "keep_nan"
    fill_strategy: "zero_fill"  #改成zero fill 应对lag300
    fields:
      - "adj_close"
      - "adj_open"
      - "adj_high" 
      - "adj_low"
      - "vwap"

  # ----------------------------------------------------
  # 成交量类因子：直接填充0
  # ----------------------------------------------------
  # 包含：成交量、成交额、换手率等交易量数据
  # 处理逻辑：NaN → 0（表示无交易）
  volume:
    description: "成交量、成交额相关数据，缺失直接填充0"
    # fill_strategy: "zero_fill"
    fill_strategy: "keep_nan"
    fields:
      - "volume"
      - "amount"
      - "turnover_rate"
      - "TRADES_COUNT"
      - "net_inflow_rate"
      - "open_net_inflow_rate"
      - "close_net_inflow_rate"
      - "initiative_buy_rate"
      - "initiative_sell_rate"
      - "large_buy_rate"
      - "large_net_inflow"
      - "moneyflow_pct"
      - "inst_buy_value"
      - "inst_sell_value"
      - "large_buy_value"
      - "large_sell_value"
      - "med_buy_value"
      - "med_sell_value"
      - "small_buy_value"
      - "small_sell_value"

  # ----------------------------------------------------
  # 价格变动类因子：直接填充0
  # ----------------------------------------------------
  # 包含：价格变动率等衍生指标
  # 处理逻辑：NaN → 0（表示无变化）
  price_change:
    description: "价格变动率等衍生指标，缺失填充0"
    # fill_strategy: "zero_fill"
    fill_strategy: "keep_nan"
    fields:
      - "pct_change"

  # ----------------------------------------------------
  # 技术指标类因子：直接填充0
  # ----------------------------------------------------
  # 包含：各种技术分析指标
  # 处理逻辑：NaN → 0（表示指标无信号）
  technical:
    description: "技术分析指标，缺失填充0"
    # fill_strategy: "zero_fill"
    fill_strategy: "keep_nan"
    fields:
      - "swing"

  # ----------------------------------------------------
  # 股息率：前向填充，仍NaN则填充0
  # ----------------------------------------------------
  # 股息率通常保持一段时间不变，适合前向填充
  # 处理逻辑：NaN → ffill → 0
  dividend:
    description: "股息率，按股票前向填充，仍NaN则填充0"
    fill_strategy: "ffill_then_zero"
    fields:
      - "dividend_yield_12m"

  # ----------------------------------------------------
  # 财务指标：前向填充，仍NaN则用当日中位数填充
  # ----------------------------------------------------
  # 财务数据更新频率较低，适合前向填充+截面中位数填充
  # 处理逻辑：NaN → ffill → 当日中位数 → 0
  financial:
    description: "财务指标，前向填充后用当日中位数填充"
    fill_strategy: "ffill_then_median"
    fields:
      - "float_market_cap"
      - "pb_ratio" 
      - "pe_ttm"
      - "rc_50d"

  # ----------------------------------------------------
  # 状态类因子：前向填充，仍NaN则用行业中位数填充
  # ----------------------------------------------------
  # 状态类数据（如涨跌停状态、交易状态等）通常具有行业特征
  # 使用行业中位数而非全市场中位数，避免大量0和少量1的平均值问题
  # 处理逻辑：NaN → ffill → 行业中位数 → 0
  status:
    description: "状态类因子，前向填充后用行业中位数填充（避免0/1不平衡问题）"
    fill_strategy: "ffill_then_industry_median"
    fields:
      - "up_down_limit_status"
      - "trade_status" 
      - "adj_factor"

  # ----------------------------------------------------
  # 另类因子：直接填充0
  # ----------------------------------------------------
  # 包含：智能持股、高频因子等另类数据
  # 处理逻辑：NaN → 0（表示无信号或无特征）
  alternative:
    description: "另类因子（智能持股、高频等），缺失直接填充0"
    # fill_strategy: "zero_fill"
    fill_strategy: "keep_nan"
    fields:
      # 智能持股类
      - "fundkey"
      - "indlead"
      - "lgtratio"
      # 高频因子类
      - "amresid_amount"
      - "apm"
