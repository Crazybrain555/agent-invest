matching:
  # 是否启用前缀匹配（默认启用）
  # 当启用时，配置中的字段名可以匹配所有以该名称开头的因子
  # 例如："adj_close"可以匹配"adj_close_mar"等
  enable_prefix_matching: true
  
  # 前缀匹配的分隔符（用于精确匹配边界）
  # 例如：确保"adj_close"不会匹配到"adj_close_something_else"
  prefix_separators: ["_", "-"]

# =====================================================
# 填充策略说明
# =====================================================
fill_strategies:
  keep_nan:
    description: "保持NaN不填充，让后续代码自动drop缺失行"
    
  zero_fill:
    description: "直接填充0"
    
  ffill_then_zero:
    description: "按股票分组前向填充，仍为NaN则填充0"
    
  ffill_then_median:
    description: "按股票分组前向填充，仍为NaN则用当日中位数填充，最后填充0"
    
  ffill_then_industry_median:
    description: "按股票分组前向填充，仍为NaN则用当日行业中位数填充，最后填充0"
    
  transform_then_zero:
    description: "先进行数值转换(/100-1)，然后填充0"
