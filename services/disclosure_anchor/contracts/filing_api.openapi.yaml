info:
  title: disclosure_anchor
  version: 0.1.0
openapi: 3.1.0
paths:
  /v1/admin/documents/register-local-pdf:
    post:
      operationId: register_local_pdf_v1_admin_documents_register_local_pdf_post
      parameters:
      - &id002
        $ref: '#/components/parameters/XContractVersion'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterLocalPdfRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterLocalPdfResponse'
          description: Successful Response
        '400':
          content:
            application/json:
              schema: &id001
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Contract version mismatch
        '422':
          content:
            application/json:
              schema: *id001
          description: Validation error
      summary: Register Local Pdf
  /v1/admin/documents/{document_id}/build-units:
    post:
      operationId: build_document_units_v1_admin_documents__document_id__build_units_post
      parameters:
      - in: path
        name: document_id
        required: true
        schema:
          title: Document Id
          type: string
      - *id002
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildUnitsResponse'
          description: Successful Response
        '400':
          content:
            application/json:
              schema: *id001
          description: Contract version mismatch
        '404':
          content:
            application/json:
              schema: *id001
          description: Not found
        '422':
          content:
            application/json:
              schema: *id001
          description: Validation error
      summary: Build Document Units
  /v1/admin/documents/{document_id}/parse:
    post:
      operationId: parse_document_v1_admin_documents__document_id__parse_post
      parameters:
      - in: path
        name: document_id
        required: true
        schema:
          title: Document Id
          type: string
      - *id002
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParserOptionsRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParseDocumentResponse'
          description: Successful Response
        '400':
