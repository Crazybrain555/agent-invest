components:
  parameters:
    XContractVersion:
      description: Supported contract version. Omit to use v1.
      in: header
      name: X-Contract-Version
      required: false
      schema:
        enum:
        - v1
        type: string
  schemas:
    AttemptSummary:
      additionalProperties: false
      properties:
        error_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Code
        finished_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Finished At
        outcome:
          anyOf:
          - enum:
            - matched
            - ambiguous
            - not_found
            - failed
            - abandoned
            - deferred
            type: string
          - type: 'null'
          title: Outcome
        retryable:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Retryable
        started_at:
          title: Started At
          type: string
      required:
      - outcome
      - started_at
      - finished_at
      - error_code
      - retryable
      title: AttemptSummary
      type: object
    ChangeEventV1:
      additionalProperties: false
      properties:
        asset_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Asset Id
        change_kind:
          title: Change Kind
          type: string
        contract_version:
          title: Contract Version
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        document_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Document Id
        event_id:
          title: Event Id
          type: string
        event_kind:
          title: Event Kind
          type: string
        occurred_at:
          format: date-time
          title: Occurred At
          type: string
        payload:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Payload
        processing_run_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Processing Run Id
        seq:
          title: Seq
          type: integer
        source:
          title: Source
          type: string
        subject_kind:
          title: Subject Kind
          type: string
        subject_ref:
          title: Subject Ref
          type: string
      required:
      - seq
      - event_id
      - event_kind
      - document_id
      - processing_run_id
      - asset_id
      - payload
      - occurred_at
      - change_kind
      - subject_kind
      - subject_ref
      - source
      - contract_version
      - created_at
      title: ChangeEventV1
      type: object
    ChangeListResponse:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/ChangeEventV1'
          title: Items
          type: array
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
      required:
      - items
      - next_cursor
      title: ChangeListResponse
      type: object
    ClassificationResponse:
      additionalProperties: false
      properties:
        class_map_version:
          title: Class Map Version
          type: string
        classes:
          items:
            $ref: '#/components/schemas/ProcessingClassV1'
          title: Classes
          type: array
        note:
          anyOf:
          - type: string
          - type: 'null'
          title: Note
        processing_policy_available:
          title: Processing Policy Available
          type: boolean
        processing_policy_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Processing Policy Version
        rule_sets:
          items:
            $ref: '#/components/schemas/ClassificationRuleSetV1'
          title: Rule Sets
          type: array
      required:
      - class_map_version
      - processing_policy_version
      - processing_policy_available
      - classes
      - rule_sets
      title: ClassificationResponse
      type: object
    ClassificationRuleSetV1:
      additionalProperties: false
      properties:
        rule_count:
          title: Rule Count
          type: integer
        rule_set:
          title: Rule Set
          type: string
        version:
          title: Version
          type: string
      required:
      - rule_set
      - version
      - rule_count
      title: ClassificationRuleSetV1
      type: object
    DisclosureInventoryOut:
      additionalProperties: false
      properties:
        contract_version:
          const: disclosure-inventory.v1
          title: Contract Version
          type: string
        items:
          items:
            $ref: '#/components/schemas/InventoryItem'
          maxItems: 200
          title: Items
          type: array
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
        notes:
          items:
            type: string
          title: Notes
          type: array
        observed_at:
          title: Observed At
          type: string
        scope:
          $ref: '#/components/schemas/InventoryScope'
        summary:
          $ref: '#/components/schemas/InventorySummary'
      required:
      - contract_version
      - observed_at
      - scope
      - summary
      - items
      - next_cursor
      - notes
      title: DisclosureInventoryOut
      type: object
    DocumentListResponse:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/DocumentV1'
          title: Items
          type: array
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
      required:
      - items
      - next_cursor
      title: DocumentListResponse
      type: object
    DocumentTargetIn:
      additionalProperties: false
      properties:
        document_id:
          title: Document Id
          type: string
        kind:
          const: document
          title: Kind
          type: string
      required:
      - kind
      - document_id
      title: DocumentTargetIn
      type: object
    DocumentTextOut:
      additionalProperties: false
      properties:
        chunks:
          items:
            $ref: '#/components/schemas/TextChunk'
          title: Chunks
          type: array
        citation:
          $ref: '#/components/schemas/TextCitation'
        contract_version:
          const: disclosure-quick-text.v1
          title: Contract Version
          type: string
        coverage:
          $ref: '#/components/schemas/TextCoverage'
        document_id:
          title: Document Id
          type: string
        document_status:
          title: Document Status
          type: string
        extractor:
          $ref: '#/components/schemas/TextExtractor'
        formal_units_available:
          title: Formal Units Available
          type: boolean
        limitations:
          items:
            type: string
          title: Limitations
          type: array
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
        raw_file_hash:
          title: Raw File Hash
          type: string
        source_byte_count:
          title: Source Byte Count
          type: integer
        text_kind:
          const: quick_native_pdf_text
          title: Text Kind
          type: string
        total_pages:
          title: Total Pages
          type: integer
      required:
      - contract_version
      - document_id
      - raw_file_hash
      - source_byte_count
      - document_status
      - formal_units_available
      - text_kind
      - extractor
      - total_pages
      - chunks
      - coverage
      - next_cursor
      - limitations
      - citation
      title: DocumentTextOut
      type: object
