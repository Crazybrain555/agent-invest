[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "disclosure-anchor"
version = "0.1.0"
description = "Local L1 disclosure ingestion and document-unit preparation service."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13",
  "fastapi>=0.115",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "PyYAML>=6.0",
  "sqlalchemy>=2.0",
  "typing_extensions>=4.10",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
test = [
  "jsonschema>=4",
]
dev = [
  "ruff>=0.15",
  "mypy>=1.14",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"disclosure_anchor.adapters.sources.cninfo" = ["filing_type_map.json"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.mypy]
python_version = "3.11"
files = ["src/disclosure_anchor"]
mypy_path = "src"
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
