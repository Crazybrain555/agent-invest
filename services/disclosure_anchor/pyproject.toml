[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "disclosure-anchor"
version = "0.1.0"
description = "Local L1 disclosure ingestion and document-unit preparation service."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13",
  "cryptography>=50",
  "fastapi>=0.115",
  "httpx>=0.27",
  "jieba==0.42.1",
  "pdfminer.six==20260107",
  "Pillow>=10.0",
  "psycopg[binary]>=3.2",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pypdfium2==5.13.0",
  "PyYAML>=6.0",
  "sqlalchemy>=2.0",
  "typing_extensions>=4.10",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
test = [
  "jsonschema>=4",
]
dev = [
  "ruff>=0.15",
  "mypy>=1.14",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"disclosure_anchor.adapters.sources.cninfo" = ["filing_type_map.json"]
"disclosure_anchor.application.contracts" = ["semantic_*_routes.v1.json"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["tests/fixtures/mineru_344_preimages"]

[tool.mypy]
python_version = "3.11"
files = ["src/disclosure_anchor", "scripts"]
mypy_path = "src"
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
