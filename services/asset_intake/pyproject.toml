[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asset-intake"
version = "0.1.0"
description = "L1 dataset_snapshot + tool_result light-registration service for the investment-research prediction engine."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
]

# envelope-kernel is a relative-path editable install (PEP 621 cannot express it portably):
#   make venv   (runs pip install -e ../../packages/envelope_kernel -e '.[test,dev]')

[project.optional-dependencies]
test = [
  "jsonschema>=4",
]
dev = [
  "ruff>=0.15",
  "mypy>=1.14",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.mypy]
python_version = "3.11"
files = ["src/asset_intake"]
mypy_path = "src"
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
