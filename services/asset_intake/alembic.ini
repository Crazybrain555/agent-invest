# Alembic configuration for asset_intake.
#
# The database URL is resolved at runtime by migrations/env.py from
# ASSET_INTAKE_MIGRATION_DATABASE_URL / ASSET_INTAKE_DATABASE_URL (via service
# settings). sqlalchemy.url is intentionally left blank; do not commit a real URL.

[alembic]
script_location = src/asset_intake/db/migrations
prepend_sys_path = src
path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
