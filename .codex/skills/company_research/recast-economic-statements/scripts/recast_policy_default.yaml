policy_version: v0.1
label_match_mode: contains
concept_match_mode: exact

defaults:
  tax_rate_default: 0.25
  tax_rate_floor: 0.0
  tax_rate_cap: 0.35
  normalized_wc: 0.0
  capex_abs: true

maintenance_capex_method:
  name: depr_floor
  floor_ratio: 0.8
  capex_floor_ratio: 0.5

owner_earnings_definition: "CFO - maintenance_capex + normalized_wc"
invested_capital_definition: "total_assets - cash - non_interest_bearing_current_liabilities (fallback: total_debt + total_equity - cash)"

mapping_rules:
  - target: revenue
    statement_type: IS
    concept_matches:
      - us-gaap:Revenues
      - us-gaap:SalesRevenueNet
      - us-gaap:RevenueFromContractWithCustomerExcludingAssessedTax
    label_matches:
      - total revenue
      - revenues
      - net revenue
      - net sales
      - total net revenue
      - sales
    rationale: Primary revenue line.

  - target: operating_income
    statement_type: IS
    concept_matches:
      - us-gaap:OperatingIncomeLoss
    label_matches:
      - operating income
      - income from operations
      - operating profit
      - operating earnings
    rationale: EBIT proxy for NOPAT.

  - target: pretax_income
    statement_type: IS
    concept_matches:
      - us-gaap:IncomeLossFromContinuingOperationsBeforeIncomeTaxesExtraordinaryItemsNoncontrollingInterest
      - us-gaap:IncomeLossFromContinuingOperationsBeforeIncomeTaxes
      - us-gaap:IncomeBeforeIncomeTaxes
    label_matches:
      - income before income taxes
      - pretax income
      - earnings before income taxes
    rationale: Effective tax rate denominator.

  - target: tax_expense
    statement_type: IS
    concept_matches:
      - us-gaap:IncomeTaxExpenseBenefit
    label_matches:
      - income tax expense
      - provision for income taxes
      - income taxes
    rationale: Effective tax rate numerator.

  - target: cfo
    statement_type: CF
    concept_matches:
      - us-gaap:NetCashProvidedByUsedInOperatingActivities
    label_matches:
      - net cash provided by operating activities
      - net cash from operating activities
      - cash flows from operating activities
      - net cash provided by operating activities
    rationale: Operating cash flow for owner earnings.

  - target: capex
    statement_type: CF
    concept_matches:
      - us-gaap:PaymentsToAcquirePropertyPlantAndEquipment
      - us-gaap:CapitalExpenditures
    label_matches:
      - capital expenditures
      - capital expenditure
      - payments for property and equipment
      - purchases of property and equipment
      - acquisition of property and equipment
    rationale: Capital expenditures for FCF and maintenance capex.

  - target: depreciation
    statement_type: CF
    concept_matches:
      - us-gaap:DepreciationAndAmortization
      - us-gaap:Depreciation
    label_matches:
      - depreciation and amortization
      - depreciation
      - amortization
    rationale: Depreciation proxy for maintenance capex floor.

  - target: cash
    statement_type: BS
    concept_matches:
      - us-gaap:CashAndCashEquivalentsAtCarryingValue
      - us-gaap:Cash
    label_matches:
      - cash and cash equivalents
      - cash
    rationale: Cash exclusion for invested capital.

  - target: total_assets
    statement_type: BS
    concept_matches:
      - us-gaap:Assets
    label_matches:
      - total assets
    rationale: Invested capital base.

  - target: total_debt
    statement_type: BS
    concept_matches:
      - us-gaap:Debt
      - us-gaap:LongTermDebt
      - us-gaap:LongTermDebtCurrent
    label_matches:
      - total debt
      - long-term debt
      - long term debt
      - short-term debt
      - current portion of long-term debt
      - total borrowings
    rationale: Invested capital fallback component.

  - target: total_equity
    statement_type: BS
    concept_matches:
      - us-gaap:StockholdersEquity
      - us-gaap:StockholdersEquityIncludingPortionAttributableToNoncontrollingInterest
    label_matches:
      - stockholders equity
      - shareholders equity
      - total equity
      - total shareholders equity
      - total stockholders equity
    rationale: Invested capital fallback component.

  - target: non_interest_bearing_current_liabilities
    statement_type: BS
    concept_matches:
      - us-gaap:AccountsPayableCurrent
      - us-gaap:AccruedLiabilitiesCurrent
    label_matches:
      - accounts payable
      - accrued liabilities
      - accrued expenses
      - operating liabilities
      - noninterest bearing current liabilities
      - non-interest-bearing current liabilities
      - total current liabilities
    rationale: Approximate non-interest-bearing current liabilities.
