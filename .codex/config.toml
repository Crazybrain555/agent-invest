# ------------------------------------------------------------
# GitHub / Git MCP
#
# 1) GitHub MCP server (deprecated package, but easiest local setup via npx)
#    Requires: export GITHUB_PERSONAL_ACCESS_TOKEN=...
#
# 2) Git MCP server (local git repo ops)
# ------------------------------------------------------------

[mcp_servers.github]
command = "/home/help/mcp/tools/bin/npx"
args = ["-y", "@modelcontextprotocol/server-github"]
startup_timeout_sec = 60
tool_timeout_sec = 240
enabled_tools = [
  # repo read/write
  "get_file_contents",
  "create_or_update_file",
  "push_files",
  "create_branch",
  "list_commits",
  # PR/issue basics
  "create_pull_request",
  "get_pull_request",
  "list_pull_requests",
  "create_issue",
  "add_issue_comment",
  # search
  "search_repositories",
  "search_code",
  "search_issues",
  "search_users"
]
env_vars = [
  "GITHUB_PERSONAL_ACCESS_TOKEN",
  "GITHUB_HOST",
  "HTTP_PROXY",
  "HTTPS_PROXY",
  "NO_PROXY",
  "http_proxy",
  "https_proxy",
  "no_proxy"
]

[mcp_servers.git]
command = "/home/help/.venvs/mcp-git/bin/python"
args = ["-m", "mcp_server_git", "--repository", "/mnt/d/python_project/Golden_price_prediction"]
startup_timeout_sec = 60
tool_timeout_sec = 180
env_vars = [
  "HTTP_PROXY",
  "HTTPS_PROXY",
  "NO_PROXY",
  "http_proxy",
  "https_proxy",
  "no_proxy"
]

[mcp_servers.playwright]
args = ["@playwright/mcp@latest"]
command = "npx"
