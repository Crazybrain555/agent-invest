# ------------------------------------------------------------
# Trading MCP: Demo 模式（当前仅做筛股/基础面，不配置 OpenAI/Reddit）
# - screen_stocks_advanced_filters：Finviz 筛选（本 Demo 只用这个就够）
# - get_fundamental_stock_metrics / compare_stock_valuations：基础面补充
#
# 以后要启用【新闻分析 / 社媒情绪】再做：
# 1) 配 OPENAI_API_KEY（新闻/情绪分析需要）
# 2) 配 Reddit 账号与 client_id/secret（社媒研究需要）
# 3) 把 enabled_tools 扩展加入：
#    - analyze_news_and_market_context
#    - discover_trending_stocks
#    - analyze_reddit_sentiment
#    - comprehensive_stock_analysis
# ------------------------------------------------------------


[mcp_servers.trading_mcp]
command = "/home/help/mcp/tools/node/bin/node"
args = ["/home/help/mcp/servers/trading-mcp/dist/bootstrap.js"]
cwd = "/home/help/mcp/servers/trading-mcp"
startup_timeout_sec = 60
tool_timeout_sec = 120
enabled_tools = [
  "screen_stocks_advanced_filters",
  "get_fundamental_stock_metrics",
  "compare_stock_valuations"
]
env_vars = [
  "HTTP_PROXY",
  "HTTPS_PROXY",
  "NO_PROXY",
  "http_proxy",
  "https_proxy",
  "no_proxy"
]

[mcp_servers.trading_mcp.env]
NODE_OPTIONS = "--trace-uncaught --trace-warnings --unhandled-rejections=strict"




